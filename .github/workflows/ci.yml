name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Push DB schema
        run: |
          npx prisma generate
          npx prisma db push

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm run test

      - name: Build Next.js Application
        run: npm run build
